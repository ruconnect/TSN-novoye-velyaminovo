<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ren'Py .rpy Parser</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="max-w-5xl mx-auto px-4 py-8">
    <header class="mb-8">
      <h1 class="text-3xl md:text-4xl font-bold">Парсер Ren'Py .rpy</h1>
      <p class="text-slate-400 mt-2">
        Загрузите файл .rpy или вставьте его содержимое вручную.
      </p>
    </header>

    <section class="grid gap-6">
      <div
        id="dropZone"
        class="transition rounded-3xl border-2 border-dashed border-slate-700 bg-slate-950/40 p-8 md:p-10 text-center"
      >
        <input id="fileInput" type="file" accept=".rpy,.txt,text/plain" class="sr-only" />

        <div class="mx-auto w-16 h-16 rounded-2xl bg-slate-800/80 flex items-center justify-center mb-5">
          <svg width="30" height="30" fill="none" viewBox="0 0 24 24" class="text-blue-300">
            <path
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 16V4m0 0 4.5 4.5M12 4 7.5 8.5M20 16.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2.5"
            />
          </svg>
        </div>

        <h2 class="text-xl font-semibold">Выберите .rpy файл</h2>
        <p class="text-slate-400 mt-2">или перетащите его в эту область</p>

        <label
          for="fileInput"
          class="inline-flex mt-5 rounded-xl px-6 py-3 font-semibold bg-blue-600 hover:bg-blue-500 transition cursor-pointer"
        >
          Открыть окно выбора файла
        </label>

        <p id="fileName" class="text-blue-300 mt-4 mono text-sm"></p>
      </div>

      <div class="rounded-3xl border border-slate-800 bg-slate-900/50 p-5">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-3">
          <div>
            <h2 class="text-xl font-semibold">Или вставьте содержимое .rpy вручную</h2>
            <p class="text-slate-400 text-sm mt-1">
              Подходит, если браузер не даёт прикрепить файл.
            </p>
          </div>

          <button
            id="parseTextButton"
            class="rounded-xl px-5 py-3 font-semibold bg-emerald-600 hover:bg-emerald-500 transition"
          >
            Разобрать текст
          </button>
        </div>

        <textarea
          id="manualText"
          class="w-full h-56 rounded-2xl bg-slate-950 border border-slate-800 p-4 mono text-sm outline-none focus:border-blue-500"
          placeholder="Вставьте сюда содержимое .rpy файла..."
        ></textarea>
      </div>

      <div class="rounded-3xl border border-slate-800 bg-slate-900/50 p-5">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-4">
          <div>
            <h2 class="text-xl font-semibold">Результат</h2>
            <p id="stats" class="text-slate-400 text-sm mt-1">Пока ничего не загружено.</p>
          </div>

          <div class="flex flex-wrap gap-2">
            <button
              id="copyButton"
              class="rounded-xl px-4 py-2 font-semibold bg-slate-800 hover:bg-slate-700 transition disabled:opacity-40 disabled:cursor-not-allowed"
              disabled
            >
              Копировать
            </button>

            <button
              id="downloadButton"
              class="rounded-xl px-4 py-2 font-semibold bg-blue-600 hover:bg-blue-500 transition disabled:opacity-40 disabled:cursor-not-allowed"
              disabled
            >
              Скачать .txt
            </button>

            <button
              id="clearButton"
              class="rounded-xl px-4 py-2 font-semibold bg-red-600 hover:bg-red-500 transition disabled:opacity-40 disabled:cursor-not-allowed"
              disabled
            >
              Очистить
            </button>
          </div>
        </div>

        <pre
          id="output"
          class="min-h-56 max-h-[600px] overflow-auto rounded-2xl bg-slate-950 border border-slate-800 p-4 mono text-sm whitespace-pre-wrap"
        ></pre>
      </div>
    </section>
  </main>

  <script>
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileName = document.getElementById("fileName");
    const manualText = document.getElementById("manualText");
    const parseTextButton = document.getElementById("parseTextButton");
    const output = document.getElementById("output");
    const stats = document.getElementById("stats");
    const copyButton = document.getElementById("copyButton");
    const downloadButton = document.getElementById("downloadButton");
    const clearButton = document.getElementById("clearButton");

    let currentResult = "";

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];

      if (!file) {
        return;
      }

      readFile(file);
    });

    dropZone.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropZone.classList.add("border-blue-500", "bg-blue-950/20");
    });

    dropZone.addEventListener("dragleave", () => {
      dropZone.classList.remove("border-blue-500", "bg-blue-950/20");
    });

    dropZone.addEventListener("drop", (event) => {
      event.preventDefault();

      dropZone.classList.remove("border-blue-500", "bg-blue-950/20");

      const file = event.dataTransfer.files[0];

      if (!file) {
        return;
      }

      readFile(file);
    });

    parseTextButton.addEventListener("click", () => {
      const text = manualText.value;

      if (!text.trim()) {
        setOutput("", "Поле ручного ввода пустое.");
        return;
      }

      fileName.textContent = "Используется текст из ручного ввода";
      processText(text);
    });

    copyButton.addEventListener("click", async () => {
      if (!currentResult) {
        return;
      }

      try {
        await navigator.clipboard.writeText(currentResult);
        copyButton.textContent = "Скопировано!";

        setTimeout(() => {
          copyButton.textContent = "Копировать";
        }, 1200);
      } catch (error) {
        alert("Не удалось скопировать текст. Можно выделить результат вручную.");
      }
    });

    downloadButton.addEventListener("click", () => {
      if (!currentResult) {
        return;
      }

      const blob = new Blob([currentResult], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");

      a.href = url;
      a.download = "renpy_parsed_text.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    });

    clearButton.addEventListener("click", () => {
      currentResult = "";
      output.textContent = "";
      manualText.value = "";
      fileInput.value = "";
      fileName.textContent = "";
      stats.textContent = "Пока ничего не загружено.";

      copyButton.disabled = true;
      downloadButton.disabled = true;
      clearButton.disabled = true;
    });

    function readFile(file) {
      fileName.textContent = "Файл: " + file.name;

      const reader = new FileReader();

      reader.onload = () => {
        processText(String(reader.result || ""));
      };

      reader.onerror = () => {
        setOutput("", "Ошибка чтения файла.");
      };

      reader.readAsText(file, "UTF-8");
    }

    function processText(text) {
      const parsedLines = parseRenPyText(text);
      const result = parsedLines.join("\n");

      if (!result.trim()) {
        setOutput("", "Текстовые строки не найдены. Возможно, формат файла отличается.");
        return;
      }

      setOutput(result, "Найдено строк: " + parsedLines.length);
    }

    function setOutput(text, statusText) {
      currentResult = text;
      output.textContent = text;
      stats.textContent = statusText;

      const hasText = Boolean(text.trim());

      copyButton.disabled = !hasText;
      downloadButton.disabled = !hasText;
      clearButton.disabled = false;
    }

    function parseRenPyText(text) {
      const lines = text.split(/\r?\n/);
      const result = [];

      for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) {
          continue;
        }

        if (line.startsWith("#")) {
          continue;
        }

        if (
          line.startsWith("label ") ||
          line.startsWith("scene ") ||
          line.startsWith("show ") ||
          line.startsWith("hide ") ||
          line.startsWith("with ") ||
          line.startsWith("jump ") ||
          line.startsWith("call ") ||
          line.startsWith("return") ||
          line.startsWith("menu:") ||
          line.startsWith("if ") ||
          line.startsWith("elif ") ||
          line.startsWith("else:") ||
          line.startsWith("$") ||
          line.startsWith("python:")
        ) {
          continue;
        }

        const dialogueMatch = line.match(/^([a-zA-Z_][\w]*)\s+"(.+)"$/);
        if (dialogueMatch) {
          result.push(dialogueMatch[1] + ": " + cleanText(dialogueMatch[2]));
          continue;
        }

        const narrationMatch = line.match(/^"(.+)"$/);
        if (narrationMatch) {
          result.push(cleanText(narrationMatch[1]));
          continue;
        }

        const menuOptionMatch = line.match(/^"(.+)"\s*:$/);
        if (menuOptionMatch) {
          result.push("Вариант: " + cleanText(menuOptionMatch[1]));
          continue;
        }

        const oldNewMatch = line.match(/^(old|new)\s+"(.+)"$/);
        if (oldNewMatch) {
          result.push(oldNewMatch[1] + ": " + cleanText(oldNewMatch[2]));
          continue;
        }
      }

      return result;
    }

    function cleanText(text) {
      return text
        .replace(/\\"/g, '"')
        .replace(/\\n/g, " ")
        .replace(/\{.*?\}/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }
  </script>
</body>
</html>
