<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Конструктор красивых сайтов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            text-align: center;
            padding: 20px 10px;
            background-color: #4CAF50;
            color: white;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        main {
            display: flex;
            gap: 20px;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        .section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 30%;
            min-width: 250px;
        }
        h2 {
            color: #4CAF50;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header>
    <h1>Красивый сайт</h1>
    <p>Описание сайта или слоган</p>
</header>

<main>
    <div class="section">
        <h2>Раздел 1</h2>
        <p>Текст для первого раздела. Здесь может быть информация о продукте или услуге.</p>
        <button>Подробнее</button>
    </div>

    <div class="section">
        <h2>Раздел 2</h2>
        <p>Текст для второго раздела. Здесь может быть список преимуществ.</p>
        <button>Подробнее</button>
    </div>

    <div class="section">
        <h2>Раздел 3</h2>
        <p>Текст для третьего раздела. Здесь можно разместить контактную информацию.</p>
        <button>Связаться</button>
    </div>
</main>

</body>
</html>
