<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>React Setup — Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a192f; /* глубокий синий */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, monospace;
      overflow: hidden;
    }

    .terminal-window {
      background-color: #0d253f;
      color: #ffffff;
      width: 80%;
      max-width: 700px;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(10, 25, 47, 0.8);
      position: relative;
      overflow: hidden;
    }

    .terminal-window::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4a90e2, #5cb8e6, #7ac6f0);
      border-radius: 4px 4px 0 0;
    }

    .log {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 0.92rem;
    }

    .progress-bar {
      display: inline-block;
      font-family: monospace;
      letter-spacing: -0.1em;
    }

    .status-text {
      color: #ffffff;
      animation: blink 0.7s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="terminal-window">
    <div class="log" id="log">
Creating a new React app in D:\my-best-proj.
Installing packages. This might take a couple of minutes.
Installing react, react-dom, and react-scripts with cra-template...
[######............] / fetchMetadata: <span class="status-text">sill</span>
      electron-to-chromium@1.3.55
    </div>
  </div>

  <script>
    const statusEl = document.querySelector('.status-text');
    const progress = '[######............]'; // 6 # + 14 . = 20 символов → 30%? Нет — 6/20 = 30% → но нужно 25% → 5 # + 15 .
    // ✅ 25% от 20 = 5 символов → [#####.............]
    const progressBar = '[#####.............]'; // 5 #, 15 .

    // Обновляем строку в логе
    const logEl = document.getElementById('log');
    const baseLines = [
      "Creating a new React app in D:\\\\my-best-proj.",
      "Installing packages. This might take a couple of minutes.",
      "Installing react, react-dom, and react-scripts with cra-template...",
      `${progressBar} / fetchMetadata: <span class="status-text">sill</span>`,
      "      electron-to-chromium@1.3.55"
    ];

    // Состояния для динамической части
    const statuses = [
      "sill", "fetch", "resolving", "downloading", "extracting",
      "linking", "building", "waiting", "retrying", "zZz", "idle",
      "checking", "verifying", "caching", "optimizing", "done?"
    ];

    let idx = 0;

    // Инициализируем
    function updateStatus() {
      const newLine = `${progressBar} / fetchMetadata: <span class="status-text">${statuses[idx]}</span>`;
      // Заменяем только строку с fetchMetadata
      const lines = logEl.innerHTML.split('\n');
      lines[3] = newLine;
      logEl.innerHTML = lines.join('\n');
      idx = (idx + 1) % statuses.length;
    }

    // Первый вызов сразу
    updateStatus();

    // Цикл каждые 400 мс (быстро, как в реальном npm)
    setInterval(updateStatus, 400);

    // Дополнительно: мерцание через CSS уже есть (.status-text + blink)
  </script>
</body>
</html>
