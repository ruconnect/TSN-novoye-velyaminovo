<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Creating a new React app...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d1117; /* GitHub Dark */
      color: #c9d1d9; /* Light gray */
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 2rem;
      line-height: 1.5;
    }

    .terminal {
      max-width: 800px;
      width: 90vw;
      padding: 1.5rem;
      white-space: pre-wrap;
      word-break: break-all;
      font-size: 0.95rem;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    .cursor {
      display: inline-block;
      width: 0.5em;
      height: 1em;
      background-color: #c9d1d9;
      animation: blink 1s infinite;
      vertical-align: middle;
      margin-left: 2px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .highlight {
      color: #79c0ff; /* Blue */
    }

    .dim {
      color: #8b949e; /* Dimmed gray */
    }

    .success {
      color: #3fb950; /* Green */
    }

    .error {
      color: #f85149; /* Red */
    }

    /* Simulate terminal scroll effect with fade-out top */
    .terminal::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3rem;
      background: linear-gradient(to bottom, #0d1117 0%, transparent 100%);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="terminal" id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    let logLines = [];
    let cursorVisible = true;

    // Основные строки лога (реалистичные из CRA + npm)
    const baseLogs = [
      "Creating a new React app in D:\\\\my-best-proj.",
      "Installing packages. This might take a couple of minutes.",
      "Installing react, react-dom, and react-scripts with cra-template...",
      "",
      "[..................] / fetchMetadata: sill",
      "electron-to-chromium@1.3.55",
      "node_modules/react",
      "node_modules/react-dom",
      "node_modules/react-scripts",
      "",
      "sill install loadCurrentTree",
      "sill install readLocalPackageData",
      "sill fetchPackageMetaData error for @babel/helper-plugin-utils@^7.22.5",
      "verbose stack Error: connect ETIMEDOUT 104.20.14.45:443",
      "verbose cwd D:\\\\my-best-proj",
      "sill install loadAllDepsIntoIdealTree",
      "sill resolveWithNewModule react@18.2.0 checking installable status",
      "sill fetchMetadata: http GET https://registry.npmjs.org/@types/react",
      "sill fetchMetadata: http 200 https://registry.npmjs.org/@types/react",
      "sill extract node_modules/.cache/... -> node_modules/@types/react",
      "",
      "⠋ [            ] ⠙ fetchMetadata: sill"
    ];

    // Дополнительные строки для циклической «бесконечной» загрузки
    const loopLogs = [
      "sill fetchMetadata: sill",
      "sill loadCurrentTree",
      "sill resolveWithNewModule react-dom@18.2.0",
      "sill extract node_modules/.cache/... -> node_modules/react-dom",
      "verbose stack Error: socket hang up",
      "sill install loadIdealTree",
      "sill fetchMetadata: http GET https://registry.npmjs.org/eslint",
      "sill fetchMetadata: http 200 https://registry.npmjs.org/eslint",
      "sill extract node_modules/.cache/... -> node_modules/eslint",
      "⠙ [..............] / loadDep: @babel/helper-plugin-utils:",
      "sill fetchMetadata: sill",
      "sill install loadAllDepsIntoIdealTree",
      "sill resolveWithNewModule @types/react@18.2.0",
      "verbose stack Error: getaddrinfo ENOTFOUND registry.npmjs.org",
      "sill retry will retry in 1000ms",
      "sill fetchMetadata: sill",
      "⠹ [.............] \\ loadDep: @types/react:",
      "sill install loadCurrentTree",
      "sill extract node_modules/.cache/... -> node_modules/@types/react",
      "sill fetchMetadata: http GET https://registry.npmjs.org/react-scripts",
      "sill fetchMetadata: http 200 https://registry.npmjs.org/react-scripts",
      "sill extract node_modules/.cache/... -> node_modules/react-scripts",
      "",
      "Creating a new React app in D:\\\\my-best-proj.",
      "Installing packages. This might take a couple of minutes."
    ];

    // Добавляем базовые логи один раз
    baseLogs.forEach(line => logLines.push(line));

    // Функция для добавления новой строки (с эффектом печати)
    function appendLine(line, delay = 50) {
      return new Promise(resolve => {
        setTimeout(() => {
          logLines.push(line);
          renderLog();
          resolve();
        }, delay);
      });
    }

    // Рендерим всё содержимое
    function renderLog() {
      const linesHTML = logLines.map((line, i) => {
        // Подсветка ключевых слов
        let html = line
          .replace(/Creating a new React app in/g, '<span class="highlight">$&</span>')
          .replace(/Installing packages./g, '<span class="dim">$&</span>')
          .replace(/sill/g, '<span class="dim">$&</span>')
          .replace(/verbose/g, '<span class="dim">$&</span>')
          .replace(/error/g, '<span class="error">$&</span>')
          .replace(/success/g, '<span class="success">$&</span>')
          .replace(/⠋|⠙|⠚|⠞|⠖|⠦|⠧|⠇|⠏/g, '<span class="highlight">$&</span>');

        return html;
      }).join('\n');

      logEl.innerHTML = linesHTML + '<span class="cursor"></span>';
      // Прокрутка вниз
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Запуск анимации
    async function startLoading() {
      renderLog();

      // Печатаем базовые строки по одной (медленно)
      for (let i = 0; i < baseLogs.length; i++) {
        await appendLine(baseLogs[i], 120);
      }

      // Бесконечный цикл: добавляем строки из loopLogs с рандомными задержками
      let idx = 0;
      setInterval(async () => {
        const line = loopLogs[idx % loopLogs.length];
        await appendLine(line, Math.random() * 200 + 50);
        idx++;
      }, 800);

      // Дополнительно: мерцание курсора через CSS уже есть, но можно усилить
      setInterval(() => {
        cursorVisible = !cursorVisible;
        const cursor = document.querySelector('.cursor');
        if (cursor) cursor.style.opacity = cursorVisible ? '1' : '0';
      }, 500);
    }

    // Запуск после загрузки
    window.addEventListener('DOMContentLoaded', startLoading);
  </script>
</body>
</html>
