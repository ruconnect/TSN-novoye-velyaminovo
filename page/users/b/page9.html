<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>React App Setup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a192f; /* глубокий синий, как на фото */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'SFMono-Regular', 'Consolas', 'Liberation Mono', Menlo, monospace;
      overflow: hidden;
    }

    .terminal-window {
      background-color: #0d253f; /* чуть светлее фона — синее окно */
      color: #ffffff; /* белый текст */
      width: 80%;
      max-width: 700px;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(10, 25, 47, 0.7);
      position: relative;
      overflow: hidden;
    }

    .terminal-window::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4a90e2, #5cb8e6, #7ac6f0);
      border-radius: 4px 4px 0 0;
    }

    .log {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 0.92rem;
    }

    .sill-placeholder {
      color: #ffffff;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Для эффекта "мелькания" sill */
    .sill-word {
      display: inline-block;
      animation: changeSill 3.2s infinite;
    }

    @keyframes changeSill {
      0%   { content: "sill"; }
      20%  { content: "fetch"; }
      40%  { content: "load"; }
      60%  { content: "retry"; }
      80%  { content: "zZz"; }
      100% { content: "sill"; }
    }
  </style>
</head>
<body>
  <div class="terminal-window">
    <div class="log" id="log">
Creating a new React app in D:\my-best-proj.
Installing packages. This might take a couple of minutes.
Installing react, react-dom, and react-scripts with cra-template...
[..................] / fetchMetadata: <span class="sill-word">sill</span>
      electron-to-chromium@1.3.55
    </div>
  </div>

  <script>
    // Меняем текст внутри .sill-word через setInterval
    const sillEl = document.querySelector('.sill-word');
    const states = ['sill', 'fetch', 'load', 'retry', 'zZz', 'wait', 'sync', 'idle'];
    let idx = 0;

    setInterval(() => {
      sillEl.textContent = states[idx];
      idx = (idx + 1) % states.length;
    }, 500); // каждые 0.5 секунды

    // Дополнительно: мерцание курсора (если хочешь добавить | после sill)
    // Но по вашему описанию — только `sill` меняется, курсор не нужен.
  </script>
</body>
</html>
